name: 'taxi_rides_ny'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# BIGQUERY LOCATION CONFIGURATION
models:
  +location: europe-west1  # ← This applies to all models
  
  # Model-specific configurations go UNDER the project name
  taxi_rides_ny:
    staging:
      materialized: view
    core:
      materialized: table

seeds:
  +location: europe-west1  # ← This applies to all seeds
  taxi_rides_ny:
    taxi_zone_lookup:
      +column_types:
        locationid: numeric

vars:
  payment_type_values: [1, 2, 3, 4, 5, 6]