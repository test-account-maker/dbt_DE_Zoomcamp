# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'taxi_rides_ny'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# BIGQUERY LOCATION CONFIGURATION - ADD THIS SECTION
# This tells dbt to create all tables in europe-west1 region
models:
  +location: europe-west1  # ← Add this line for all models

seeds:
  +location: europe-west1  # ← Add this line for seeds

# Your existing model configurations
taxi_rides_ny:
  # Applies to all files under models/.../
  staging:
    materialized: view
    +location: europe-west1  # ← Optional: specific for staging
  core:
    materialized: table
    +location: europe-west1  # ← Optional: specific for core

vars:
  payment_type_values: [1, 2, 3, 4, 5, 6]

seeds: 
  taxi_rides_ny:
    taxi_zone_lookup:
      +column_types:
        locationid: numeric
      +location: europe-west1  # ← Add location for seeds